<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: flex;
        background: #f4f6f9;
      }

      .sidebar {
        width: 220px;
        height: 100vh;
        background: #0d6efd;
        color: white;
        padding: 20px;
      }

      .sidebar h2 {
        margin-bottom: 30px;
      }

      .sidebar ul {
        list-style: none;
      }

      .sidebar ul li {
        padding: 12px;
        margin-bottom: 10px;
        cursor: pointer;
        border-radius: 6px;
      }

      .sidebar ul li:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .navbar {
        background: white;
        padding: 15px 25px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .logout-btn {
        background: #0d6efd;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 5px;
        cursor: pointer;
      }

      .container {
        padding: 30px;
      }

      .cards {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }

      .card {
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        width: 250px;
      }

      .card h3 {
        margin-bottom: 10px;
        color: #333;
      }

      .card p {
        color: #666;
      }
    </style>
  </head>

  <body>
    <div class="sidebar">
      <h2>My Panel</h2>

      <ul>
        <li>Dashboard</li>
        <li>Users</li>
        <li>Profile</li>
        <li>Settings</li>
      </ul>
    </div>

    <div class="main">
      <div class="navbar">
        <h3>Dashboard</h3>
        <button class="logout-btn" onclick="logoutUser()">Logout</button>
      </div>

      <div class="container">
        <h1 id="welcomeUser">Welcome</h1>
        <br />

        <div class="cards">
          <div class="card">
            <h3>Total Users</h3>
            <p>120</p>
          </div>

          <div class="card">
            <h3>Orders</h3>
            <p>45</p>
          </div>

          <div class="card">
            <h3>Messages</h3>
            <p>12</p>
          </div>

          <div class="card">
            <h3>Revenue</h3>
            <p>$560</p>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
