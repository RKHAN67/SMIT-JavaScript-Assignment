<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <style>
      body {
        margin: 0;
        font-family: Arial;
        background: #f1f3f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .box {
        background: white;
        padding: 35px;
        width: 350px;
        border-radius: 8px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        text-align: center;
      }

      input {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      button {
        width: 100%;
        padding: 10px;
        margin-top: 15px;
        background: #0d6efd;
        border: none;
        color: white;
        border-radius: 4px;
        cursor: pointer;
      }

      #helperText {
        color: red;
        font-size: 14px;
        margin-top: 10px;
      }

      a {
        display: block;
        margin-top: 15px;
        color: #0d6efd;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div class="box">
      <h2>Login</h2>

      <form
        onsubmit="
          loginAccount();
          return false;
        "
      >
        <input type="email" id="userEmail" placeholder="Enter Email" />

        <input type="password" id="userPassword" placeholder="Enter Password" />

        <button>Login</button>
      </form>

      <p id="helperText"></p>

      <a href="register.html">Create Account</a>
    </div>

    <script src="script.js"></script>
  </body>
</html>
